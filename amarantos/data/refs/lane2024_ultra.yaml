hard_claims:
- summary: High UPF consumption associated with 50% higher risk of cardiovascular
    disease mortality
  choice: avoid_ultra_processed_foods
  evidence_type: Meta-analysis
  effects:
  - outcome: cardiovascular mortality
    mean: 1.5
    std: 0.0663
  population: general adult population
  notes: 95% CI 1.37-1.63 (std transcribed as CI width / 3.92); class I (convincing)
    evidence classification but GRADE certainty very low; umbrella review of 45 unique
    meta-analyses; also found 12% higher risk of type 2 diabetes
- summary: High UPF consumption associated with 21% higher all-cause mortality risk
  choice: avoid_ultra_processed_foods
  evidence_type: Meta-analysis
  effects:
  - outcome: all-cause mortality
    mean: 1.21
    std: 0.0306
  population: general adult population
  notes: 95% CI 1.15-1.27 (std transcribed as CI width / 3.92); class II (highly
    suggestive) evidence classification, GRADE certainty low; consistent across
    multiple meta-analyses; dose-response relationship evident
- summary: High UPF consumption associated with higher risk of anxiety (OR 1.48),
    combined common mental disorders (OR 1.53), and depressive outcomes (HR 1.22)
  choice: avoid_ultra_processed_foods
  evidence_type: Meta-analysis
  effects:
  - outcome: prevalent anxiety (odds ratio)
    mean: 1.48
    std: 0.0561
  - outcome: combined common mental disorders (odds ratio)
    mean: 1.53
    std: 0.051
  - outcome: incident depressive outcomes (hazard ratio)
    mean: 1.22
    std: 0.0306
  population: general adult population
  notes: Anxiety 95% CI 1.37-1.59 and common mental disorders 1.43-1.63 are class I
    prevalence odds ratios (GRADE low); depressive outcomes 1.16-1.28 are class II
    incident hazard ratios (GRADE low); the widely quoted ~1.5 figures refer to anxiety
    and combined mental disorders, not depression specifically
