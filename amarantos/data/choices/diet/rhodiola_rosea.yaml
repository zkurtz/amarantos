domain: diet
name: Rhodiola Rosea
summary: |-
  Adaptogenic herb approved by EMA for stress-related symptoms. Systematic review
  of 11 RCTs suggests benefits for physical/mental fatigue, but methodological
  flaws limit conclusions.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 200-600mg/day. Adaptogenic herb approved by EMA for stress-related symptoms. Systematic review
    of 11 RCTs suggests benefits for physical/mental fatigue, but methodological
    flaws limit conclusions. May improve attention and reduce burnout. Effects via
    modulating neurotransmitters (dopamine, serotonin). No mortality data. Evidence
    quality low; heterogeneous study designs.
effects:
- outcome: Relative mortality risk
  mean: 1.0
  std: 0.1
  evidence: |
    No mortality or cardiovascular studies. Adaptogenic mechanisms may
    reduce stress-related health impacts indirectly. Purely speculative
    for mortality effect.
- outcome: Years of delayed aging
  mean: 0.0
  std: 0.7
  evidence: |
    Anti-inflammatory and antioxidant properties. May protect against
    stress-induced aging. No human longevity studies. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.4
  std: 0.4
  evidence: |
    Systematic review of 11 RCTs suggests benefits for fatigue and stress.
    ([@s2012_rhodiola]). RCT: improved
    attention and reduced burnout scores.
    ([@e2022_effectiveness]). Methodological
    limitations. Moderate positive effect possible.
