hard_claims:
- summary: Synthesis of over 100 prospective studies and meta-analyses concludes a
    UPF-dominant dietary pattern is a key driver of the global rise in diet-related
    chronic disease
  choice: upf_avoidance
  evidence_type: Expert opinion
  effects: []
  population: global
  notes: Paper 1 of the Lancet 2025 Series on UPF; combines narrative and systematic
    review with original meta-analyses; positions UPF as a primary public-health priority
    rather than a single nutrient question
soft_claims:
- summary: UPF dietary patterns harm every major organ system through nutrient imbalance,
    hyperpalatability-driven overeating, loss of phytochemicals, and additive/contaminant
    exposure
  choice: upf_avoidance
  source_type: review article
  notes: Authors propose three core hypotheses (displacement, diet-quality deterioration,
    chronic-disease risk), each supported by current evidence base
