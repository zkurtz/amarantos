domain: diet
name: Fisetin
summary: |-
  Flavonoid senolytic found in strawberries. Extended lifespan 10% in mice by
  clearing senescent cells.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: intermittent dosing, dose TBD. Flavonoid senolytic found in strawberries. Extended lifespan 10% in mice by
    clearing senescent cells. Human trials (AFFIRM-LITE) ongoing. 2025 mouse study
    showed improved grip strength and reduced frailty. Low bioavailability limits
    translation. No human mortality data. Evidence quality very low; highly
    speculative but mechanistically promising.
effects:
- outcome: Relative mortality risk
  mean: 0.95
  std: 0.15
  evidence: |
    No human mortality data. Mouse studies: fisetin extended median and
    maximum lifespan, improved tissue homeostasis.
    ([@mj2018_fisetin]). 2025 study: reduced
    frailty markers and improved physical function in old mice.
    ([@murray2025_intermittent]). Human trials
    ongoing. Highly speculative estimate based on animal data.
- outcome: Years of delayed aging
  mean: 1.0
  std: 1.5
  evidence: |
    Most potent senolytic among 10 flavonoids tested. Clears senescent cells
    and reduces SASP markers. DQ+Fisetin trials examining epigenetic clocks.
    ([@lee2024_exploring]). Strong mechanistic
    rationale but limited human data. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.0
  std: 0.5
  evidence: |
    No human wellbeing data. Reduced frailty in mice may translate to
    improved function. Purely speculative.
