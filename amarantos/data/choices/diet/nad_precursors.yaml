domain: diet
name: NAD+ Precursors
summary: |-
  Nicotinamide mononucleotide (NMN) and nicotinamide riboside (NR) boost NAD+
  levels reliably. Meta-analyses show elevated blood NAD+ but limited functional
  benefits in RCTs.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: NMN/NR, 250-1000mg/day. Nicotinamide mononucleotide (NMN) and nicotinamide riboside (NR) boost NAD+
    levels reliably. Meta-analyses show elevated blood NAD+ but limited functional
    benefits in RCTs. No improvement in muscle mass/sarcopenia in older adults.
    Some cognitive trials show reduced epigenetic age but no cognitive improvement.
    Evidence quality low; promising preclinical data not yet translated to humans.
effects:
- outcome: Relative mortality risk
  mean: 0.98
  std: 0.12
  evidence: |
    No mortality RCTs. Meta-analysis of 12 RCTs (n=513): NMN raises NAD+ but
    most clinical outcomes NS vs control. Risk of bias concerns in most
    studies. ([@j2025_efficacy]). Meta-analysis:
    NMN/NR show minimal benefits for sarcopenia.
    ([@k2025_nicotinamide]). Highly speculative
    estimate.
- outcome: Years of delayed aging
  mean: 0.5
  std: 1.2
  evidence: |
    NR trial in MCI: reduced epigenetic age (PhenoAge, GrimAge) but no
    cognitive improvement. ([@me2023_randomized]).
    Benefits may be limited to those with suboptimal baseline NAD+. Promising
    but unproven in humans. High uncertainty.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.4
  evidence: |
    Select improvements in gait speed and grip strength in some trials.
    Energy benefits reported anecdotally. Limited RCT evidence. Small
    positive effect possible.
