domain: diet
name: Vitamin D
summary: |-
  Essential hormone-like vitamin; deficiency common. Meta-analysis of RCTs:
  daily supplementation reduces cancer mortality by 12% (not incidence).
specification:
  duration_h: 0.001
  weekly_freq: 7
  annual_cost_h: 5
  annual_cost_usd: 50
  description: |-
    Recommended: 1000-4000 IU/day to sufficiency. Essential hormone-like vitamin; deficiency common. Meta-analysis of RCTs:
    daily supplementation reduces cancer mortality by 12% (not incidence). All-cause
    mortality reduced 6% with >5 years follow-up. No effect on CVD mortality.
    Daily dosing more effective than intermittent bolus. Target serum 30-50ng/mL.
    Evidence quality moderate for cancer mortality; high for bone health.
effects:
- outcome: Relative mortality risk
  mean: 0.92
  std: 0.04
  evidence: |
    Meta-analysis of RCTs: cancer mortality RR 0.87 (95% CI: 0.79-0.96) with
    daily dosing [@keum2019_vitd_cancer].
    All-cause mortality RR 0.94 with >3 years follow-up
    [@rodrguez-artalejo2005_health].
    CVD mortality NS. Benefit requires daily dosing, sufficient duration.
- outcome: Years of delayed aging
  mean: 0.5
  std: 0.6
  evidence: |
    Vitamin D receptors throughout body. Deficiency associated with frailty
    and cognitive decline. May support muscle function. No epigenetic clock
    studies specific to supplementation. Moderate confidence.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.3
  evidence: |
    Deficiency associated with depression. Meta-analyses show modest benefits
    for mood in deficient individuals. No clear benefit in replete individuals.
