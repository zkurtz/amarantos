domain: thermal
name: Red Light Therapy
summary: |-
  Photobiomodulation using red/near-infrared light (600-1000nm). Umbrella review
  of RCTs: 17% moderate, 57% low, 26% very low certainty evidence.
specification:
  duration_h: 0.3
  weekly_freq: 7
  annual_cost_h: 120
  annual_cost_usd: 400
  description: |-
    Recommended: 600-1000nm, daily 10-20min. Photobiomodulation using red/near-infrared light (600-1000nm). Umbrella review
    of RCTs: 17% moderate, 57% low, 26% very low certainty evidence. Best evidence
    for skin rejuvenation (collagen), wound healing, and chronic pain (NNT=4).
    May improve muscle endurance. No mortality or longevity data. Small studies,
    optimal protocols unclear. Evidence quality low-moderate.
effects:
- outcome: Relative mortality risk
  mean: 1.0
  std: 0.1
  evidence: |
    No mortality studies. Umbrella review of 35 meta-analyses: mostly low
    certainty evidence. ([@y2025_photobiomodulation]).
    May improve metabolic markers in some populations. Purely speculative
    for mortality.
- outcome: Years of delayed aging
  mean: 0.2
  std: 0.7
  evidence: |
    May improve skin quality (collagen synthesis). Potentially improves
    mitochondrial function via cytochrome c oxidase. RCT showed improved
    sleep in mild insomnia. ([@mc2022_near]).
    Limited human aging data. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.3
  evidence: |
    Meta-analysis: 2.8-point VAS pain reduction for chronic pain (NNT=4).
    May improve skin appearance and self-perception. Limited mood data.
    Small positive effect for pain conditions.
