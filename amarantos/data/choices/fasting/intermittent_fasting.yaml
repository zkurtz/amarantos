domain: fasting
name: Intermittent Fasting
summary: |-
  Periodic caloric restriction including 5:2 (2 days/week at 500-600 kcal) or
  alternate day fasting. Meta-analyses show similar weight loss to continuous
  restriction.
specification:
  duration_h: 0.0
  weekly_freq: 2
  annual_cost_h: 0
  annual_cost_usd: 0
  description: |-
    Recommended: 5:2 or alternate day. Periodic caloric restriction including 5:2 (2 days/week at 500-600 kcal) or
    alternate day fasting. Meta-analyses show similar weight loss to continuous
    restriction. May improve insulin sensitivity and lipid profiles. Adherence
    variable. No mortality RCTs. Effects likely overlap with caloric restriction.
    Evidence quality moderate.
effects:
- outcome: Relative mortality risk
  mean: 0.92
  std: 0.1
  evidence: |
    No mortality RCTs. Meta-analysis of 18 RCTs: similar weight loss and metabolic
    improvements to continuous caloric restriction. ([@a2021_effectiveness]).
    Ramadan fasting observational studies show mixed results. Effect on
    mortality extrapolated from metabolic benefits. Speculative.
- outcome: Years of delayed aging
  mean: 0.4
  std: 0.7
  evidence: |
    Periodic fasting activates autophagy, reduces IGF-1, and may promote
    cellular renewal. ([@vd2021_intermittent]). Animal
    models show lifespan benefits. Human aging data very limited.
    Mechanistically promising. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.0
  std: 0.4
  evidence: |
    On fasting days: hunger, reduced energy, possible irritability.
    Non-fasting days: normal eating freedom. Some report improved
    relationship with food long-term. Adherence challenges for many.
    Mixed effect; individual variation high.
