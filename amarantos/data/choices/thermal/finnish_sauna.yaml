domain: thermal
name: Finnish Sauna
summary: |-
  Best-studied heat therapy with strong mortality data. Finnish cohort (n=2,315):
  4-7x/week sauna associated with 40% lower all-cause mortality, 50% lower CVD
  mortality, 63% lower sudden cardiac death vs 1x/week.
specification:
  duration_h: 0.5
  weekly_freq: 5
  annual_cost_h: 150
  annual_cost_usd: 1200
  description: |-
    Recommended: 4-7x/week, 15-20min. Best-studied heat therapy with strong mortality data. Finnish cohort (n=2,315):
    4-7x/week sauna associated with 40% lower all-cause mortality, 50% lower CVD
    mortality, 63% lower sudden cardiac death vs 1x/week. Effects persist after
    adjustment for exercise and risk factors. Improves endothelial function, lowers
    BP. Evidence quality high from large prospective cohorts.
effects:
- outcome: Relative mortality risk
  mean: 0.65
  std: 0.06
  evidence: |
    Kuopio cohort (n=2,315, 20.7y follow-up): 4-7x/week vs 1x/week: HR 0.60
    for all-cause mortality, HR 0.50 for CVD mortality, HR 0.37 for sudden
    cardiac death. ([@laukkanen2015_sauna]). Extended
    cohort including women (n=1,688): linear decrease in CVD mortality with
    frequency. ([@t2018_sauna]).
    Associative evidence; highly consistent.
- outcome: Years of delayed aging
  mean: 1.5
  std: 0.8
  evidence: |
    Heat shock proteins induced by sauna may protect against protein
    aggregation. Improves vascular function and reduces inflammation.
    Associated with lower dementia risk. No epigenetic clock studies.
    Strong biological plausibility.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.4
  std: 0.3
  evidence: |
    Sauna associated with improved mood and relaxation. May improve sleep
    quality. Social component in traditional Finnish culture. Moderate
    positive effect likely.
