hard_claims:
- summary: Highest vs lowest quarter of UPF consumption associated with only 4% higher
    all-cause mortality over 30+ years of follow-up in the Harvard cohorts
  choice: avoid_ultra_processed_foods
  evidence_type: Prospective cohort study
  effects:
  - outcome: all-cause mortality
    mean: 1.04
    std: 0.0153
  population: US female nurses (NHS) and male health professionals (HPFS) free of
    cancer, CVD, and diabetes at baseline
  sample_size: 114064
  followup_years: 32
  notes: 48,193 deaths; 95% CI 1.01-1.07; null associations for cancer and CVD mortality;
    excess driven by other causes (HR 1.09, 1.05-1.13); the longest-follow-up UPF-mortality
    cohorts published and a materially smaller estimate than NutriNet-Sante or UK Biobank
- summary: No consistent UPF-mortality association within strata of overall diet quality
    (AHEI-2010), while better diet quality predicted lower mortality within every UPF
    stratum
  choice: avoid_ultra_processed_foods
  evidence_type: Prospective cohort study
  effects: []
  population: US female nurses (NHS) and male health professionals (HPFS)
  sample_size: 114064
  notes: Suggests overall diet quality dominates UPF share per se. Subtype analysis
    concentrated risk in meat/poultry/seafood ready-to-eat products (HR 1.06-1.43),
    sugar- and artificially-sweetened beverages (HR 1.09, 1.07-1.12), and dairy-based
    desserts (HR 1.07); ultra-processed breakfast foods showed only HR 1.04
