domain: diet
name: Potassium
summary: |-
  Essential mineral; most adults under-consume. Meta-analysis: reduces SBP by
  3.5mmHg, DBP by 2mmHg; greater effect in hypertensives (-7mmHg SBP).
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 3500-4700mg/day from food. Essential mineral; most adults under-consume. Meta-analysis: reduces SBP by
    3.5mmHg, DBP by 2mmHg; greater effect in hypertensives (-7mmHg SBP). 24%
    lower stroke risk with higher intake. U-shaped relationship suggests optimal
    range; excessive intake may increase BP. WHO recommends ≥3.5g/day. Dietary
    sources preferred. Evidence quality high.
effects:
- outcome: Relative mortality risk
  mean: 0.92
  std: 0.05
  evidence: |
    Systematic review and meta-analysis: higher potassium intake associated
    with 24% lower stroke risk (RR 0.76). CVD risk reduction NS in some
    analyses. ([@nj2013_increased]). Salt substitute
    trial showed reduced CV mortality with potassium-enriched salt. U-shaped
    dose-response suggests optimal intake range.
    ([@filippini2020_potassium]). Dietary
    sources preferred.
- outcome: Years of delayed aging
  mean: 0.3
  std: 0.6
  evidence: |
    Supports vascular function and may protect against cognitive decline
    via BP reduction. No epigenetic clock studies. Associated with healthy
    dietary patterns. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.3
  evidence: |
    Deficiency causes fatigue and muscle weakness. Adequate intake supports
    muscle function and energy. Limited direct mood data.
