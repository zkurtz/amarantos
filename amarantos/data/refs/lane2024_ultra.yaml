summary: Umbrella review synthesizing 45 unique meta-analyses of prospective studies
  examining ultra-processed food (UPF) consumption and health outcomes. High UPF intake
  was directly associated with 50% higher cardiovascular disease mortality risk, 21%
  higher all-cause mortality, 48% higher prevalent anxiety, 53% higher combined common
  mental disorders (depressive outcomes specifically 22% higher), 12% higher
  type 2 diabetes risk, and adverse outcomes across multiple organ systems. Evidence
  was most convincing for mortality, CVD events, and mental health outcomes.
