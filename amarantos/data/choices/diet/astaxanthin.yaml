domain: diet
name: Astaxanthin
summary: |-
  Potent carotenoid antioxidant from algae/seafood. Modest benefits for lipid
  profile (LDL reduction) and blood pressure.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 4-12mg/day. Potent carotenoid antioxidant from algae/seafood. Modest benefits for lipid
    profile (LDL reduction) and blood pressure. No mortality trials. Promising
    pilot data in heart failure (improved ejection fraction). Better safety
    profile than vitamin E. Evidence is preliminary; mostly small trials.
effects:
- outcome: Relative mortality risk
  mean: 1.0
  std: 0.1
  evidence: |
    No mortality RCTs. Meta-analysis of 17 studies (n=1101) shows improved
    lipid profile. Fassett 2017 [@fassett2017_astaxanthin].
    Theoretical CVD benefit via lipids/inflammation but unproven for hard
    endpoints. Unlike vitamin E, no signal of harm. Centered at null.
- outcome: Years of delayed aging
  mean: 0.0
  std: 0.8
  evidence: |
    Strong antioxidant in vitro. Animal studies show benefits. Human aging
    studies absent. Reduces oxidative stress markers. No epigenetic clock
    data. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.3
  evidence: |
    Pilot heart failure study showed improved exercise tolerance (+39m on
    6MWT) and quality of life. Xia 2020 [@sg2024_astaxanthin]. Limited to HF
    patients. No general population mood data.
