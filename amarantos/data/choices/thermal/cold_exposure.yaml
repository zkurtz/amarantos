domain: thermal
name: Cold Exposure
summary: |-
  Deliberate cold exposure via showers (30sec-3min) or immersion (10-15°C). 2025 meta-analysis: may reduce stress and improve sleep quality with limited
  evidence; little support for mood or immunity claims.
specification:
  duration_h: 0.1
  weekly_freq: 5
  annual_cost_h: 30
  annual_cost_usd: 100
  description: |-
    Recommended: cold showers, ice baths. Deliberate cold exposure via showers (30sec-3min) or immersion (10-15°C).
    2025 meta-analysis: may reduce stress and improve sleep quality with limited
    evidence; little support for mood or immunity claims. Enhances parasympathetic
    activity. May reduce adipose tissue and improve insulin sensitivity. CAUTION:
    contraindicated in CVD. Evidence quality low; mostly small studies.
effects:
- outcome: Relative mortality risk
  mean: 1.0
  std: 0.1
  evidence: |
    No mortality RCTs. 2025 PLOS One meta-analysis (11 studies, n=3,177):
    limited evidence for health benefits. ([@cain2025_cold]).
    May reduce insulin resistance and body fat. CAUTION: contraindicated
    in cardiovascular disease. ([@aha2022_cold]).
    Centered at null with uncertainty.
- outcome: Years of delayed aging
  mean: 0.2
  std: 0.8
  evidence: |
    Cold exposure activates brown adipose tissue and may improve metabolic
    health. Hormetic stress may enhance resilience. Limited human longevity
    data. Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.4
  evidence: |
    Anecdotal reports of improved alertness and mood. Meta-analysis found
    little evidence for mood benefits. May improve stress tolerance.
    Effects variable between individuals. Small effect uncertain.
