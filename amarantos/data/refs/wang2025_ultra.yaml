id: wang2025_ultra
title: Ultra-processed foods, biological ageing, and all-cause mortality risk - a
  prospective cohort study using 172,225 participants from UK Biobank
authors:
- Wang Y
- Qi T
- Wu X
- et al.
year: 2025
reference_type: Journal article
keywords:
