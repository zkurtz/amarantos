domain: environment
name: Nature Exposure
summary: |-
  Time in natural environments including parks, forests, and green spaces. Large studies: 120+ min/week in nature associated with significantly better
  health and wellbeing.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 2+ hours/week outdoors. Time in natural environments including parks, forests, and green spaces.
    Large studies: 120+ min/week in nature associated with significantly better
    health and wellbeing. Forest bathing (shinrin-yoku) reduces cortisol and
    BP. Green space access associated with lower mortality. Mechanisms include
    stress reduction, physical activity, air quality. Evidence quality moderate.
effects:
- outcome: Relative mortality risk
  mean: 0.9
  std: 0.06
  evidence: |
    Meta-analysis (n=8M): highest green space exposure HR 0.84 for
    all-cause mortality. ([@rojas2019_greenspace]).
    UK study (n=19,806): 120+ min/week nature associated with good health
    and wellbeing. ([@white2019_nature]). Benefits
    plateau around 200-300 min/week. Associative; confounded with SES.
- outcome: Years of delayed aging
  mean: 0.4
  std: 0.5
  evidence: |
    Forest bathing reduces cortisol, BP, and inflammatory markers.
    Chronic stress accelerates aging; nature exposure may buffer.
    Urban green space associated with better cognitive aging.
    Moderate indirect evidence.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.5
  std: 0.3
  evidence: |
    Strong evidence: time in nature improves mood, reduces stress and
    anxiety, improves attention restoration. Meta-analysis supports
    mental health benefits of green space. 120+ min/week threshold
    for significant benefit. Moderate-large positive effect.
