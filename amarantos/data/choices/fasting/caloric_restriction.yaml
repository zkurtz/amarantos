domain: fasting
name: Caloric Restriction
summary: |-
  Sustained caloric restriction without malnutrition. CALERIE trial: 15%
  reduction improved cardiometabolic markers, reduced oxidative stress.
specification:
  duration_h: 0.0
  weekly_freq: 7
  annual_cost_h: 0
  annual_cost_usd: -500
  description: |-
    Recommended: 15-25% below maintenance. Sustained caloric restriction without malnutrition. CALERIE trial: 15%
    reduction improved cardiometabolic markers, reduced oxidative stress. Strong
    lifespan extension in animal models (20-50%). Human lifespan data limited to
    observational (Okinawa). CAUTION: muscle loss, reduced bone density, cold
    intolerance. Evidence quality moderate for biomarkers; limited for longevity.
effects:
- outcome: Relative mortality risk
  mean: 0.85
  std: 0.12
  evidence: |
    CALERIE trial (n=218, 2 years): 15% CR improved cardiometabolic markers,
    reduced inflammation (CRP), oxidative stress.
    ([@kraus2019_calerie]). Animal CR extends lifespan
    20-50%. Okinawan centenarians historically ate ~80% of typical calories.
    Strong mechanistic basis; limited human mortality data.
- outcome: Years of delayed aging
  mean: 1.5
  std: 0.8
  evidence: |
    CALERIE: CR slowed biological aging (~2-3% pace of aging reduction).
    ([@r2023_long]). Strong evidence in animal
    models for slowed aging. Best-studied longevity intervention.
    Moderate-high confidence for aging delay.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.4
  evidence: |
    CALERIE: sustained CR group reported improved mood and quality of life
    despite chronic mild hunger. ([@ck2016_calorie]).
    Requires strong motivation. Long-term adherence difficult. Cold
    intolerance and reduced energy common. Mixed individual effects.
