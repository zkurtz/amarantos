summary: First free-living randomized crossover trial (n=55) to compare ultra-processed
  vs minimally processed diets when both follow national healthy-eating guidance (UK
  Eatwell Guide). Over 8 weeks of ad libitum eating, the minimally processed arm
  produced ~1 percentage-point greater weight loss (-2.06% vs -1.05%), about twice
  the magnitude on MPF. The trial extends Hall 2019 by showing that ultra-processing
  matters even within a nutritionally adequate dietary pattern, though cardiometabolic
  effects were mixed. Has generated active methodological debate (see correspondence
  in Nature Medicine).
