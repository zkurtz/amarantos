domain: diet
name: Lion's Mane Mushroom
summary: |-
  Medicinal mushroom (Hericium erinaceus) that stimulates NGF and BDNF synthesis. RCTs show cognitive improvement in MCI (MMSE +1.17 points); benefits decline
  after discontinuation.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 500-3000mg/day. Medicinal mushroom (Hericium erinaceus) that stimulates NGF and BDNF synthesis.
    RCTs show cognitive improvement in MCI (MMSE +1.17 points); benefits decline
    after discontinuation. Mixed results in healthy adults; some null findings.
    No mortality data. Safe with minor GI side effects. Evidence quality low-moderate.
effects:
- outcome: Relative mortality risk
  mean: 0.98
  std: 0.1
  evidence: |
    No mortality data. Systematic review shows neuroprotective effects and
    cognitive improvement in MCI patients. ([@a2025_benefits]).
    No cardiovascular outcomes studied. Speculative estimate based on
    cognitive preservation hypothesis.
- outcome: Years of delayed aging
  mean: 0.5
  std: 0.8
  evidence: |
    Stimulates NGF and BDNF, supporting neuronal health. RCT in MCI: improved
    MMSE scores with 16-week supplementation. ([@y2019_improvement]).
    May protect against cognitive decline. Benefits reversible upon stopping.
    Moderate confidence.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.4
  evidence: |
    Pilot studies suggest reduced subjective stress and improved mood in
    some populations. ([@s2023_acute]).
    Mixed results overall. Small positive effect possible.
