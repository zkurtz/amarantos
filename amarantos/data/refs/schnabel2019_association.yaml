summary: Prospective cohort study of 44,551 French adults (NutriNet-Santé cohort)
  examining the association between ultra-processed food consumption and mortality.
  Each 10 percentage-point increase in UPF consumption was associated with a 14% higher
  risk of all-cause mortality (HR 1.14, 95% CI 1.04-1.27). Association remained after
  adjustment for sociodemographic and lifestyle factors, nutritional quality, and diet
  composition.
