hard_claims:
- summary: At 8 weeks, minimally processed diet led to ~2x greater weight loss than
    ultra-processed diet, with both arms following UK Eatwell healthy-eating guidance
  choice: upf_avoidance
  evidence_type: Randomized controlled trial
  effects:
  - outcome: 8-week percent weight change difference (MPF minus UPF)
    mean: -1.01
    std: 0.44
  population: adults with overweight/obesity (BMI 25-39.9) consuming ≥50% kcal from
    UPF
  sample_size: 55
  followup_years: 0.15
  notes: 2x2 crossover with 4-week washout; both diets were ad libitum and nutritionally
    aligned with UK Eatwell Guide; demonstrates that ultra-processing matters even
    within nutritionally adequate dietary patterns
- summary: Cardiometabolic markers showed mixed but generally favorable effects on
    minimally processed diet (triglycerides decreased more) vs ultra-processed (LDL
    decreased more on UPF)
  choice: upf_avoidance
  evidence_type: Randomized controlled trial
  effects: []
  population: adults with overweight/obesity (BMI 25-39.9)
  sample_size: 55
  notes: Cardiometabolic results not uniformly favoring MPF; LDL-C reduction was greater
    on UPF arm, possibly reflecting fat-substitute formulations; weight loss was the
    primary outcome
