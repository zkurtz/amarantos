summary: Small randomized trial (n=23) comparing progressive calisthenic push-up training
  against traditional bench press training, 3 days/week for 4 weeks. Both groups improved
  1RM bench press significantly with no between-group difference, and the calisthenics
  group improved push-up progression capacity more. First trial evidence that progressively
  scaled calisthenics can match free-weight training for upper-body strength gains.
