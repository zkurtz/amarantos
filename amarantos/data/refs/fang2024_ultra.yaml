summary: Population-based cohort study of 74,563 women (Nurses' Health Study) and
  39,501 men (Health Professionals Follow-up Study) followed ~30+ years with 48,193
  deaths. Highest vs lowest quarter of UPF intake showed HR 1.04 (95% CI 1.01-1.07)
  for all-cause mortality, null for cancer and CVD mortality, and no consistent
  association within strata of overall diet quality (AHEI-2010). Risk concentrated
  in meat/poultry/seafood ready-to-eat products and sweetened beverages. The strongest
  published counterweight to larger UPF-mortality estimates from shorter-follow-up
  cohorts, indicating overall diet quality dominates UPF share per se.
