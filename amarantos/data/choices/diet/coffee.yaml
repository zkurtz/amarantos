domain: diet
name: Coffee
summary: |-
  Moderate coffee consumption (3-4 cups/day) is associated with 15-20% lower
  all-cause mortality and reduced depression risk. Effects are observational
  with possible healthy user bias.
specification:
  duration_h: 0.1
  weekly_freq: 7
  annual_cost_h: 40
  annual_cost_usd: 400
  description: |-
    Recommended: moderate, 3-4 cups/day. Moderate coffee consumption (3-4 cups/day) is associated with 15-20% lower
    all-cause mortality and reduced depression risk. Effects are observational
    with possible healthy user bias. Morning consumption may be more protective
    than all-day drinking.
effects:
- outcome: Relative mortality risk
  mean: 0.83
  std: 0.023
  evidence: |
    Meta-analysis of 40 cohort studies, n=3.8M. HR 0.83 (95% CI: 0.79-0.88)
    for 3-4 cups/day vs non-drinkers. Associative evidence; healthy user
    bias possible. Poole 2017 [@poole2017_coffee].
    Morning timing more protective per Eur Heart J 2024 [@he2024_concerns].
- outcome: Years of delayed aging
  mean: 1.0
  std: 1.0
  evidence: |
    No direct epigenetic clock studies. Extrapolated from mortality reduction:
    ~17% lower mortality roughly corresponds to 1-2 years using Gompertz
    assumptions. Speculative estimate with high uncertainty.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.3
  std: 0.2
  evidence: |
    Meta-analysis of 12 cohort studies, n=346,913. High vs low consumption:
    RR 0.76 for depression. 8% lower risk per cup/day up to ~4 cups.
    Associative evidence. Wang 2016 [@wang2016_coffee_depression].
