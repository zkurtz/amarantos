domain: diet
name: Collagen Peptides
summary: |-
  Hydrolyzed collagen improves skin elasticity, joint health, and bone density
  in RCTs. Meta-analyses show modest LDL reduction (-4mg/dL) and BP reduction
  (-5mmHg).
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 5-15g/day. Hydrolyzed collagen improves skin elasticity, joint health, and bone density
    in RCTs. Meta-analyses show modest LDL reduction (-4mg/dL) and BP reduction
    (-5mmHg). May increase fat-free mass. No mortality studies. Benefits most
    evident after 3+ months. Evidence quality moderate for joints/skin.
effects:
- outcome: Relative mortality risk
  mean: 0.98
  std: 0.08
  evidence: |
    No mortality RCTs. Meta-analysis of RCTs shows reduced LDL (-4mg/dL) and
    SBP (-5mmHg). ([@z2023_collagen]). Theoretical
    CVD benefit via lipid/BP improvements. Extrapolated estimate with high
    uncertainty.
- outcome: Years of delayed aging
  mean: 0.2
  std: 0.5
  evidence: |
    Improves skin hydration and elasticity in RCTs.
    ([@sy2023_oral]). Supports joint and
    bone health. No epigenetic clock studies. May slow visible aging markers.
    Speculative for biological aging.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.3
  evidence: |
    May reduce joint pain and improve mobility in osteoarthritis. Improved
    skin appearance may enhance self-perception. Limited direct mood data.
    Small positive effect plausible.
