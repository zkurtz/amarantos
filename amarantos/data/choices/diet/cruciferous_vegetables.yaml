domain: diet
name: Cruciferous Vegetables
summary: |-
  Broccoli, kale, cabbage, Brussels sprouts rich in sulforaphane and
  isothiocyanates. Large meta-analyses show inverse association with all-cause
  mortality, CVD mortality, and cancer incidence.
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 3+ servings/week. Broccoli, kale, cabbage, Brussels sprouts rich in sulforaphane and
    isothiocyanates. Large meta-analyses show inverse association with all-cause
    mortality, CVD mortality, and cancer incidence. 23% lower cancer risk. Dose-
    response relationship observed. Among the most consistently beneficial food
    groups. Evidence quality high (large cohort studies).
effects:
- outcome: Relative mortality risk
  mean: 0.88
  std: 0.04
  evidence: |
    2017 meta-analysis of 95 studies: cruciferous vegetables inversely
    associated with CVD and all-cause mortality.
    ([@aune2017_vegetables]). Shanghai cohort (n=134,796):
    dose-response pattern for cruciferous and mortality.
    ([@x2011_cruciferous]). Japanese cohort
    (n=88,184): higher intake associated with reduced all-cause mortality.
    ([@n2019_cruciferous]). Associative evidence;
    consistent across populations.
- outcome: Years of delayed aging
  mean: 1.0
  std: 0.7
  evidence: |
    Sulforaphane activates Nrf2 pathway, reduces oxidative stress and
    inflammation. Animal studies show lifespan benefits. No human epigenetic
    clock data. Strong biological plausibility for anti-aging effects.
    Moderate confidence.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.3
  evidence: |
    No direct mood RCTs. Part of healthy dietary patterns associated with
    better mood. May reduce inflammation linked to depression. Indirect
    evidence only.
