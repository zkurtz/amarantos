hard_claims:
- summary: Progressive calisthenic push-up training produced 1RM bench press strength
    gains comparable to traditional bench press training over 4 weeks
  choice: calisthenics
  evidence_type: Randomized controlled trial
  effects: []
  population: healthy, moderately trained men (mean age 23)
  sample_size: 23
  followup_years: 0.077
  notes: Both groups significantly increased 1RM (p<0.001); push-up progression capacity
    increased more in the calisthenics group; no significant muscle-thickness change
    in either group over the short 4-week window; supports treating progressive-variation
    bodyweight training as equivalent resistance exposure to external loading
