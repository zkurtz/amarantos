domain: diet
name: Spermidine
summary: |-
  Polyamine that induces autophagy, a key longevity mechanism. NHANES cohort:
  highest intake associated with lower all-cause and CVD mortality.
specification:
  duration_h: 0.001
  weekly_freq: 7
  annual_cost_h: 5
  annual_cost_usd: 200
  description: |-
    Recommended: dietary, ~10-20mg/day from food. Polyamine that induces autophagy, a key longevity mechanism. NHANES cohort:
    highest intake associated with lower all-cause and CVD mortality. Bruneck Study:
    ~40% lower heart failure risk with highest intake. Extends lifespan in yeast,
    flies, mice. 2024 Nature Cell Biology: essential for fasting-mediated autophagy.
    Found in aged cheese, mushrooms, legumes, whole grains. Evidence quality moderate.
effects:
- outcome: Relative mortality risk
  mean: 0.88
  std: 0.05
  evidence: |
    NHANES analysis (n=23,894): higher dietary spermidine associated with
    reduced CVD and all-cause mortality.
    ([@h2022_association]). Bruneck Study:
    ~40% lower heart failure risk with high intake. Independent cohort
    (n=1,770): confirmed mortality association.
    ([@f2018_spermidine]). Associative evidence.
- outcome: Years of delayed aging
  mean: 1.0
  std: 0.7
  evidence: |
    Primary mechanism is autophagy induction. 2024 Nature Cell Biology:
    spermidine essential for fasting-induced autophagy and lifespan extension.
    ([@hofer2024_spermidine]). Extends lifespan in
    multiple species. Cardioprotective in mice.
    ([@t2016_cardioprotection]). Strong mechanistic
    rationale.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.3
  evidence: |
    May improve cognitive function via autophagy. No direct mood RCTs.
    Part of healthy dietary patterns. Indirect evidence only.
