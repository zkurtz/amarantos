domain: diet
name: Fatty Fish
summary: |-
  Salmon, sardines, mackerel rich in omega-3 (EPA/DHA). Meta-analysis of 25
  cohorts (n=2M): 9% lower CVD mortality, 4% reduction per 20g/day.
specification:
  duration_h: 0.3
  weekly_freq: 3
  annual_cost_h: 50
  annual_cost_usd: 500
  description: |-
    Recommended: 2+ servings/week. Salmon, sardines, mackerel rich in omega-3 (EPA/DHA). Meta-analysis of 25
    cohorts (n=2M): 9% lower CVD mortality, 4% reduction per 20g/day. RCTs of
    omega-3 supplements show reduced cardiovascular mortality. Benefits more
    consistent for fish intake than supplements. Evidence quality high for
    observational; RCTs mixed.
effects:
- outcome: Relative mortality risk
  mean: 0.91
  std: 0.04
  evidence: |
    Meta-analysis of 25 cohorts (n=2,027,512): fish consumption associated
    with 9% lower CVD mortality (RR 0.91, 95% CI: 0.85-0.98). Marine n-3
    PUFA intake: RR 0.87 for CVD mortality.
    ([@jiang2021_intake]). 2021 meta-analysis of 38 RCTs:
    omega-3 reduced cardiovascular mortality.
    ([@su2021_omega]). Associative and
    causal evidence.
- outcome: Years of delayed aging
  mean: 0.7
  std: 0.6
  evidence: |
    Omega-3s reduce inflammation and may protect telomere length. Associated
    with slower cognitive decline. No epigenetic clock studies for fish
    specifically. Moderate confidence.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.3
  evidence: |
    Omega-3s show modest benefits for depression in meta-analyses. May
    improve brain health. Small positive effect plausible.
