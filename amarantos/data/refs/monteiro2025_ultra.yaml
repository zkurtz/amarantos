summary: Lead paper of the November 2025 Lancet three-paper series on ultra-processed
  foods. Combines narrative review, systematic synthesis of 100+ prospective studies
  and meta-analyses, and original analyses to argue three propositions - UPF displacement
  of traditional diets, resulting diet-quality deterioration, and chronic-disease
  risk across organ systems. Frames UPF as a global public-health priority. Companion
  papers address policy responses.
