domain: diet
name: Leafy Greens
summary: |-
  Spinach, kale, arugula, lettuce rich in nitrates, vitamins, and fiber. NHS/HPFS:
  each serving associated with 11% lower CVD risk.
specification:
  duration_h: 0.1
  weekly_freq: 7
  annual_cost_h: 40
  annual_cost_usd: 300
  description: |-
    Recommended: 1+ servings/day. Spinach, kale, arugula, lettuce rich in nitrates, vitamins, and fiber. NHS/HPFS:
    each serving associated with 11% lower CVD risk. Danish cohort (n=53,150):
    nitrate intake up to 60mg/day (≈1 cup) associated with lower IHD, stroke, PAD,
    and HF. Among strongest vegetable-CVD associations. Evidence quality high.
effects:
- outcome: Relative mortality risk
  mean: 0.88
  std: 0.04
  evidence: |
    2017 meta-analysis: green leafy vegetables inversely associated with CVD
    and all-cause mortality. ([@aune2017_vegetables]).
    NHS/HPFS combined: each serving associated with 11% lower CVD risk.
    ([@a2021_dietary]). Danish cohort:
    vegetable nitrate intake associated with lower CVD events.
    ([@bondonno2021_vegetable]).
    Associative evidence; consistent.
- outcome: Years of delayed aging
  mean: 0.8
  std: 0.6
  evidence: |
    Nitrates improve vascular function and may slow cognitive decline. Rich
    in antioxidants and folate. Associated with healthy aging. No epigenetic
    clock studies. Strong biological plausibility.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.3
  evidence: |
    Part of healthy dietary patterns associated with better mood. Nitrates
    may improve exercise performance and energy. Indirect evidence only.
