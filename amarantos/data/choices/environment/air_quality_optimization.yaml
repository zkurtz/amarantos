domain: environment
name: Air Quality Optimization
summary: |-
  Within first-world variation range: indoor air filtration, choosing lower
  pollution neighborhoods, avoiding high-traffic areas. PM2.5 strongly
  associated with mortality even at levels below WHO guidelines.
specification:
  duration_h: 0.0
  weekly_freq: 7
  annual_cost_h: 5
  annual_cost_usd: 300
  description: |-
    Recommended: HEPA filtration, low-pollution living. Within first-world variation range: indoor air filtration, choosing lower
    pollution neighborhoods, avoiding high-traffic areas. PM2.5 strongly
    associated with mortality even at levels below WHO guidelines. HEPA filters
    reduce indoor particles by 50-70%. Moving from moderate to low pollution
    areas shows measurable benefit. Evidence quality high for air pollution
    effects; moderate for intervention effectiveness.
effects:
- outcome: Relative mortality risk
  mean: 0.95
  std: 0.05
  evidence: |
    Meta-analysis: 10 μg/m³ increase in PM2.5 associated with 6-8% higher
    mortality. ([@l2015_reporting]). Effects persist
    below WHO guidelines. Within first-world range (5-25 μg/m³), moving
    from high to low exposure meaningful. HEPA filter RCTs show reduced
    BP and inflammation markers. ([@de2015_everolimus]).
- outcome: Years of delayed aging
  mean: 0.3
  std: 0.4
  evidence: |
    Air pollution associated with accelerated epigenetic aging and
    shorter telomeres. ([@ck2016_long]).
    PM2.5 exposure linked to cognitive decline. Reducing exposure
    may slow these processes. Moderate evidence.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.2
  std: 0.2
  evidence: |
    Air pollution associated with reduced cognitive performance and
    increased depression symptoms. Cleaner air improves respiratory
    comfort. HEPA filters reduce allergy symptoms. Small positive
    effect within first-world variation range.
