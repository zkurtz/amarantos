summary: Prospective cohort study of 105,159 participants (NutriNet-Santé) examining
  ultra-processed food intake and cardiovascular disease risk. Each 10 percentage-point
  increase in UPF consumption was associated with significantly higher risks of overall
  CVD (HR 1.12), coronary heart disease (HR 1.13), and cerebrovascular disease (HR
  1.11). Association remained after adjusting for nutritional quality, suggesting effects
  beyond simple nutrient composition.
