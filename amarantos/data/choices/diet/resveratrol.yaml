domain: diet
name: Resveratrol
summary: |-
  Polyphenol found in red grapes with extensive preclinical longevity data. Human RCTs show mixed results: some BP reduction, inconsistent effects on
  lipids and inflammation.
specification:
  duration_h: 0.001
  weekly_freq: 7
  annual_cost_h: 5
  annual_cost_usd: 150
  description: |-
    Recommended: 150-500mg/day. Polyphenol found in red grapes with extensive preclinical longevity data.
    Human RCTs show mixed results: some BP reduction, inconsistent effects on
    lipids and inflammation. High doses (≥1000mg/day) may increase LDL. Conflicting
    findings possibly due to gut microbiome variation. No mortality RCTs.
    Translation from animal to human disappointing. Evidence quality low.
effects:
- outcome: Relative mortality risk
  mean: 1.0
  std: 0.08
  evidence: |
    No mortality RCTs. Meta-analysis shows some BP reduction and anti-
    inflammatory effects in CVD patients.
    ([@m2022_anti]). High doses associated with
    increased LDL/TC. Inconsistent effects across trials.
    ([@brown2024_resveratrol]). Clinical evidence does not
    support clear benefit. Centered at null.
- outcome: Years of delayed aging
  mean: 0.0
  std: 0.8
  evidence: |
    Strong preclinical evidence for lifespan extension via SIRT1 activation.
    Human translation limited. No epigenetic clock studies show benefit.
    Speculative for human aging.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.0
  std: 0.3
  evidence: |
    No direct mood RCTs. May improve cognitive function in some populations.
    Limited evidence. Uncertain effect.
