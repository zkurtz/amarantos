domain: diet
name: L-Carnitine
summary: |-
  Amino acid derivative important for fatty acid metabolism. Meta-analysis of
  RCTs shows 27% reduction in all-cause mortality in secondary prevention (post-MI
  patients).
specification:
  duration_h: 0.5
  weekly_freq: 3
  annual_cost_h: 100
  annual_cost_usd: 100
  description: |-
    Recommended: 2-3g/day. Amino acid derivative important for fatty acid metabolism. Meta-analysis of
    RCTs shows 27% reduction in all-cause mortality in secondary prevention (post-MI
    patients). Reduces ventricular arrhythmias by 65% and angina by 40%. Concerns
    about TMAO production via gut microbiota. Benefits primarily in cardiac patients,
    not general population.
effects:
- outcome: Relative mortality risk
  mean: 0.9
  std: 0.1
  evidence: |
    DiNicolantonio 2013 meta-analysis of 13 RCTs (n=3,629) in secondary
    prevention: 27% reduction in all-cause mortality (OR 0.73, 95% CI: 0.54-0.99).
    65% reduction in ventricular arrhythmias. 40% reduction in angina
    [@dinicolantonio2013_carnitine].
    Causal evidence from RCTs but in cardiac patients only. Mendelian randomization
    suggests possible CAD risk in general population [@jv2022_carnitine].
- outcome: Years of delayed aging
  mean: 0.0
  std: 0.8
  evidence: |
    No human aging studies. Supports mitochondrial function in theory.
    Animal studies suggest some benefit. TMAO concerns may offset benefits.
    Speculative.
- outcome: Subjective wellbeing - number of just-noticeable differences
  mean: 0.1
  std: 0.3
  evidence: |
    May reduce fatigue in chronic fatigue syndrome and improve exercise
    capacity. Limited RCT data in healthy individuals. Small positive effect
    possible in those with deficiency.
