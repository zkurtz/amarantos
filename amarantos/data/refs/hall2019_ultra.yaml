summary: Landmark inpatient crossover RCT (n=20) at the NIH Clinical Center comparing
  ad libitum intake on ultra-processed vs minimally processed diets matched for presented
  calories, energy density, macronutrients, sugar, sodium, and fiber. Participants
  consumed ~508 kcal/day more on the ultra-processed arm and gained ~0.9 kg over 2
  weeks, vs losing ~0.9 kg on the unprocessed arm. First experimental evidence that
  ultra-processing itself, independent of nutrient composition, increases energy intake.
